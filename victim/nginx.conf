worker_processes 1;
error_log /dev/stderr warn;
pid /run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    access_log off;
    server_tokens off;

    server {
        # Small backlog on purpose: the reproducer needs the SYN queue to be
        # full so net.ipv4.tcp_syncookies kicks in for the cookie request.
        listen 8080 backlog=8;
        location / {
            return 200 "ok\n";
        }
    }
}
